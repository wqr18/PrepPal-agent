spring.application.name=PrepPal

# ===== Datasource (MySQL, values injected from repo-root .env) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:preppal}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Upload limits (materials: txt/md only, single file <=5MB) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== MyBatis-Plus =====
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

# ===== Spring AI 1.0.x (OpenAI-compatible API - SiliconFlow) =====
spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.api-key=${SILICONFLOW_API_KEY:}
spring.ai.openai.chat.options.model=deepseek-ai/DeepSeek-V4-Flash
spring.ai.openai.embedding.options.model=BAAI/bge-m3

# ===== JWT =====
# JWT_SECRET must be at least 32 chars (HS256 requirement). Injected from .env, never hardcode it.
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.expiration=604800
auth.jwt.issuer=preppal

# ===== WeChat Mini Program =====
# Real wx.login is wired: UserServiceImpl.wxCodeToOpenid calls api.weixin.qq.com/sns/jscode2session.
# Without WX_APPID / WX_SECRET the real path fails fast with a clear message - use code=mock (auth.mock-enabled=true) instead.
auth.wx.appid=${WX_APPID:}
auth.wx.secret=${WX_SECRET:}

# ===== Business parameters (RAG retrieval & lesson plan generation) =====
preppal.rag.chunk-size=500
preppal.rag.chunk-overlap=50
preppal.rag.max-text-length=50000
preppal.rag.top-k=5
preppal.rag.similarity-threshold=0.35
preppal.lesson.generate-timeout-seconds=60

# ===== Mock login (dev only) =====
auth.mock-enabled=${MOCK_ENABLED:false}