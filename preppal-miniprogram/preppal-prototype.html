<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrepPal 智能备课 · 微信小程序高保真原型</title>
<style>
/* ============================================================
   PrepPal 智能备课 — WeChat Mini Program Hi-Fi Prototype
   设计令牌
   ============================================================ */
:root{
  --brand:#2B4ACB;          /* 深靛蓝 · 智慧蓝 */
  --brand-600:#2540B4;
  --brand-700:#1B2F87;
  --brand-50:#EEF2FF;
  --brand-100:#DCE4FE;
  --ink:#0F172A;
  --ink-2:#475467;
  --ink-3:#8A94A6;
  --bg:#F3F6FC;             /* 浅蓝灰背景 */
  --card:#FFFFFF;
  --line:#E8EDF6;
  --line-2:#F1F4FA;
  --ok:#12A150;
  --ok-bg:#E9F8EF;
  --warn:#B7791F;
  --warn-bg:#FEF7E6;
  --warn-line:#F5DFA8;
  --danger:#E5484D;
  --danger-bg:#FEECEC;
  --r-lg:18px;
  --r-md:14px;
  --r-sm:10px;
  --sh-1:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -14px rgba(16,24,40,.16);
  --sh-2:0 2px 6px rgba(16,24,40,.06), 0 18px 40px -20px rgba(27,47,135,.30);
  --sh-brand:0 10px 24px -10px rgba(43,74,203,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 560px at 8% -12%, #D9E4FF 0%, rgba(217,228,255,0) 62%),
    radial-gradient(900px 520px at 104% 4%, #E4EEFF 0%, rgba(228,238,255,0) 60%),
    #EAEFF7;
  -webkit-font-smoothing:antialiased;
}
/* ---------- 桌面框架：左侧说明 + 中央手机 ---------- */
.app{display:flex;gap:26px;height:100vh;padding:24px 26px;overflow:hidden}
.sidebar{
  width:296px;flex:0 0 296px;height:100%;overflow:auto;
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);border-radius:22px;
  padding:20px 18px;box-shadow:var(--sh-1);
}
.brand{display:flex;gap:11px;align-items:center}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(145deg,var(--brand),var(--brand-700));
  color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-brand);
}
.brand h1{font-size:15px;margin:0;letter-spacing:-.2px}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
.side-note{
  margin:16px 0 6px;font-size:11.5px;line-height:1.75;color:var(--ink-2);
  background:var(--brand-50);border:1px solid var(--brand-100);border-radius:12px;padding:10px 11px;
}
.side-sec{margin-top:16px}
.side-sec>h3{
  font-size:11px;letter-spacing:.14em;color:var(--ink-3);margin:0 0 9px;font-weight:600;text-transform:uppercase;
}
.navlist{display:flex;flex-direction:column;gap:3px}
.navlist button{
  all:unset;cursor:pointer;display:flex;gap:9px;align-items:center;
  padding:7px 9px;border-radius:9px;font-size:12.5px;color:var(--ink-2);
  transition:background .15s,color .15s;
}
.navlist button:hover{background:#EDF1F9;color:var(--ink)}
.navlist button .n{
  width:19px;height:19px;flex:0 0 19px;border-radius:6px;background:#EBF0FA;color:var(--ink-3);
  font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:600;
}
.navlist button.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:var(--sh-brand)}
.navlist button.active .n{background:rgba(255,255,255,.24);color:#fff}
.switch{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--ink-2);padding:6px 2px;cursor:pointer}
.switch input{display:none}
.switch i{
  width:32px;height:19px;flex:0 0 32px;border-radius:20px;background:#D7DEEA;position:relative;transition:background .18s;
}
.switch i::after{
  content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  transition:transform .18s;box-shadow:0 1px 3px rgba(16,24,40,.28);
}
.switch input:checked + i{background:var(--brand)}
.switch input:checked + i::after{transform:translateX(13px)}
.ghost{
  all:unset;cursor:pointer;margin-top:10px;width:100%;text-align:center;padding:9px;
  border-radius:11px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);background:#fff;
}
.ghost:hover{border-color:var(--brand-100);color:var(--brand);background:var(--brand-50)}
.side-foot{margin-top:18px;font-size:10.5px;color:var(--ink-3);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;min-width:0}
@media (max-width:1240px){.app{gap:18px;padding:18px}.device{zoom:.9}}
@media (max-width:1120px){.sidebar{width:252px;flex-basis:252px}.device{zoom:.84}}
@media (max-width:980px){.app{gap:12px}.sidebar{width:224px;flex-basis:224px;padding:16px 13px}.device{zoom:.76}}
@media (max-width:860px){.app{padding:12px;gap:8px}.sidebar{width:200px;flex-basis:200px}.device{zoom:.68}}
@media (max-width:760px){.app{padding:8px}.sidebar{display:none}.device{zoom:.8}}

/* ---------- 手机外框 ---------- */
.device{
  width:390px;height:844px;flex:0 0 auto;border-radius:52px;padding:11px;
  background:linear-gradient(160deg,#1B2138,#0B1020);
  box-shadow:0 40px 80px -30px rgba(11,16,32,.55), 0 2px 0 rgba(255,255,255,.12) inset;
}
.screen{
  position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column;
}
/* 状态栏 */
.statusbar{
  height:46px;flex:0 0 46px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 5px;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.2px;
  background:transparent;position:relative;z-index:6;
}
.statusbar .icons{display:flex;gap:5px;align-items:center}
.statusbar svg{display:block}
/* 导航栏 */
.navbar{
  flex:0 0 44px;height:44px;display:flex;align-items:center;padding:0 12px;position:relative;z-index:6;
  background:transparent;
}
.navbar .nav-title{
  position:absolute;left:0;right:0;text-align:center;font-size:16.5px;font-weight:600;letter-spacing:-.2px;
  pointer-events:none;
}
.navbar .nav-back{
  all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink);z-index:2;
}
.navbar .nav-back:hover{background:rgba(15,23,42,.06)}
.capsule{
  margin-left:auto;width:78px;height:30px;border-radius:15px;background:rgba(255,255,255,.66);
  border:1px solid rgba(15,23,42,.07);display:flex;align-items:center;justify-content:space-around;
  position:relative;z-index:2;backdrop-filter:blur(6px);
}
.capsule .dots{display:flex;gap:3px}
.capsule .dots i{width:4px;height:4px;border-radius:50%;background:#3D4657;display:block}
.capsule .div{width:1px;height:16px;background:rgba(15,23,42,.12)}
.capsule svg{color:#3D4657}
/* 视口 */
.viewport{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.viewport::-webkit-scrollbar{display:none}
/* Tab Bar */
.tabbar{
  flex:0 0 auto;display:flex;align-items:center;padding:6px 0 0;background:rgba(255,255,255,.94);
  border-top:1px solid var(--line);backdrop-filter:blur(12px);position:relative;z-index:5;
}
.tabbar.hide{display:none}
.tabbar .tab{
  all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--ink-3);padding:4px 0 6px;
}
.tabbar .tab.active{color:var(--brand);font-weight:600}
.safearea{height:22px;flex:0 0 22px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center}
.tabbar.hide + .safearea{background:var(--bg)}
.homebar{width:134px;height:5px;border-radius:3px;background:rgba(15,23,42,.22)}

/* ---------- 通用页面元素 ---------- */
.page{min-height:100%;display:flex;flex-direction:column;padding:4px 16px 18px;animation:pageIn .24s cubic-bezier(.22,.7,.35,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.page-body{flex:1}
h1.page-title{font-size:22px;margin:2px 0 2px;letter-spacing:-.5px}
.page-sub{font-size:12.5px;color:var(--ink-3);margin:0 0 14px}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-1);border:1px solid rgba(232,237,246,.9)}
.sec{margin-top:16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px}
.sec-head h3{font-size:14.5px;margin:0;letter-spacing:-.2px}
.sec-head a{font-size:12px;color:var(--brand);cursor:pointer;text-decoration:none;font-weight:500}
.tag-soft{font-size:10.5px;color:var(--brand);background:var(--brand-50);border-radius:6px;padding:2px 6px;font-weight:600}
.divider{height:1px;background:var(--line);margin:0}
.muted{color:var(--ink-3)}
/* 按钮 */
.btn{
  all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 18px;border-radius:14px;font-size:15px;font-weight:600;text-align:center;
  transition:transform .12s, box-shadow .18s, background .18s;letter-spacing:-.2px;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:linear-gradient(180deg,var(--brand),var(--brand-600));color:#fff;box-shadow:var(--sh-brand)}
.btn-primary:hover{box-shadow:0 12px 28px -10px rgba(43,74,203,.62)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-1)}
.btn-ghost:hover{border-color:var(--brand-100);color:var(--brand)}
.btn-soft{background:var(--brand-50);color:var(--brand);border:1px solid var(--brand-100)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 10px 22px -12px rgba(229,72,77,.8)}
.btn-block{width:100%}
.btn-sm{padding:9px 13px;border-radius:11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 底部固定操作条 */
.bottom-bar{
  position:sticky;bottom:0;margin:18px -16px 0;padding:12px 16px 14px;
  background:rgba(243,246,252,.95);backdrop-filter:blur(10px);
  box-shadow:0 -10px 18px -14px rgba(15,23,42,.22);
  display:flex;flex-direction:column;gap:8px;z-index:4;
}
.bottom-bar .row{display:flex;gap:10px}
.bottom-bar .row .btn{flex:1}
.bar-hint{font-size:11px;color:var(--ink-3);text-align:center}
/* 表单 */
.field{margin-bottom:14px}
.field > label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);margin:0 0 7px 2px}
.field .req{color:var(--danger);font-weight:600}
.field .opt{font-size:10.5px;color:var(--ink-3);font-weight:500;background:#F1F4FA;border-radius:5px;padding:1px 5px}
.input,.textarea{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r-md);
  padding:13px 14px;font-size:14.5px;color:var(--ink);font-family:inherit;outline:none;
  transition:border-color .16s, box-shadow .16s;box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.input::placeholder,.textarea::placeholder{color:#A9B2C0}
.input:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(43,74,203,.13)}
.textarea{min-height:92px;resize:vertical;line-height:1.6}
.field.invalid .input,.field.invalid .textarea{border-color:var(--danger);box-shadow:0 0 0 3.5px rgba(229,72,77,.1)}
.err{display:none;font-size:11.5px;color:var(--danger);margin:6px 0 0 3px}
.field.invalid .err{display:block}
.picker-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);background:#fff;border-radius:var(--r-md);padding:13px 14px;cursor:pointer;
  font-size:14.5px;box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.picker-row:hover{border-color:var(--brand-100)}
.seg{display:flex;background:#EDF1F8;border-radius:12px;padding:3px;gap:3px}
.seg button{
  all:unset;cursor:pointer;flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:13px;color:var(--ink-2);
  transition:all .16s;font-weight:500;
}
.seg button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
.hint-box{
  display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.6;color:var(--ink-2);
  background:var(--brand-50);border:1px solid var(--brand-100);border-radius:12px;padding:10px 12px;
}
.hint-box b{color:var(--brand)}
/* 状态标签 */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:7px;padding:3px 7px;white-space:nowrap}
.chip-dot{width:5px;height:5px;border-radius:50%}
.chip.draft{background:#FFF4E5;color:#B7791F}
.chip.final{background:var(--ok-bg);color:var(--ok)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.load{background:var(--brand-50);color:var(--brand)}
.chip.err{background:var(--danger-bg);color:var(--danger)}
.chip.neutral{background:#F1F4FA;color:var(--ink-2)}
/* 提示条 */
.notice{
  display:flex;gap:9px;align-items:flex-start;border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.65;
}
.notice.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:#7A5310}
.notice.warn .ic{color:#C08A22}
.notice.info{background:var(--brand-50);border:1px solid var(--brand-100);color:#26418F}
.notice.ok{background:var(--ok-bg);border:1px solid #BFE7CE;color:#0C7C3D}
.notice .ic{flex:0 0 16px;margin-top:1px}
/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 22px;gap:6px}
.empty .art{
  width:78px;height:78px;border-radius:22px;background:linear-gradient(150deg,#E7EEFF,#F6F9FF);
  border:1px solid #DFE7FA;display:flex;align-items:center;justify-content:center;color:var(--brand);margin-bottom:8px;
}
.empty h4{margin:0;font-size:15px;letter-spacing:-.2px}
.empty p{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.75;max-width:250px}
.empty .btn{margin-top:14px}
/* 列表项 */
.li{
  display:flex;gap:12px;align-items:center;padding:13px 14px;cursor:pointer;transition:background .14s;
}
.li:hover{background:#FAFBFE}
.li + .li{border-top:1px solid var(--line-2)}
.li .grow{flex:1;min-width:0}
.li .t{font-size:14px;font-weight:600;letter-spacing:-.2px;margin:0 0 4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.li .m{font-size:11.5px;color:var(--ink-3);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chev{color:#B9C2D0;flex:0 0 auto}
.fileicon{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--brand-50);color:var(--brand);font-size:9.5px;font-weight:700;letter-spacing:.02em;
}
.fileicon.txt{background:#EEF7F1;color:#0F8A4A}
.fileicon.md{background:#EEF1FF;color:#3B49B8}
.fileicon.big{width:52px;height:52px;flex-basis:52px;border-radius:14px;font-size:11px}
.avatar-btn{
  all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;flex:0 0 42px;
  background:linear-gradient(150deg,#4B6BE5,#22347F);color:#fff;font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-brand);
}
.avatar-btn:hover{transform:translateY(-1px)}
/* 首页 */
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 2px 0}
.home-head .greet{font-size:22px;font-weight:700;margin:0;letter-spacing:-.5px}
.home-head .sub{font-size:12.5px;color:var(--ink-3);margin:5px 0 0}
.cta-card{
  margin-top:16px;border-radius:20px;padding:18px;position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#2B4ACB 0%,#1B2F87 62%,#152564 100%);
  box-shadow:0 18px 36px -18px rgba(27,47,135,.75);
}
.cta-card::after{
  content:"";position:absolute;right:-40px;top:-56px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.30), rgba(255,255,255,0) 68%);
}
.cta-card h2{margin:0;font-size:19px;letter-spacing:-.4px}
.cta-card p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(255,255,255,.82);max-width:230px}
.cta-card .btn{margin-top:15px;background:#fff;color:var(--brand-700);box-shadow:0 10px 22px -12px rgba(0,0,0,.6);width:100%}
.cta-top{display:flex;align-items:center;gap:9px;justify-content:space-between}
.cta-badge{
  flex:0 0 auto;font-size:10.5px;color:rgba(255,255,255,.82);white-space:nowrap;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:4px 8px;
}
.stat-row{display:flex;gap:10px;margin-top:16px}
.stat{
  flex:1;background:#fff;border:1px solid rgba(232,237,246,.9);border-radius:15px;padding:12px 13px;box-shadow:var(--sh-1);
}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.6px;color:var(--ink)}
.stat .n small{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-left:2px}
.stat .l{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.stat.accent .n{color:var(--brand)}
.course-card{padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .14s,box-shadow .18s}
.course-card:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.course-card .name{font-size:15px;font-weight:650;margin:0 0 5px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:10.5px;color:var(--ink-2);background:#F4F7FC;border:1px solid var(--line);border-radius:7px;padding:3px 7px}
/* 课程详情头部 */
.course-hero{
  border-radius:20px;padding:17px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#3355D6,#1E3288);
  box-shadow:0 16px 32px -18px rgba(30,50,136,.7);
}
.course-hero h2{margin:0 30px 7px 0;font-size:19px;letter-spacing:-.4px}
.course-hero p{margin:0;font-size:12.5px;color:rgba(255,255,255,.82);line-height:1.65}
.course-hero .more{
  all:unset;cursor:pointer;position:absolute;right:13px;top:13px;width:28px;height:28px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.16);
}
.course-hero .more:hover{background:rgba(255,255,255,.26)}
.two-cards{display:flex;gap:10px;margin-top:14px}
.mini-card{
  flex:1;background:#fff;border:1px solid rgba(232,237,246,.9);border-radius:15px;padding:13px;cursor:pointer;
  box-shadow:var(--sh-1);transition:transform .14s,box-shadow .18s;
}
.mini-card:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.mini-card .h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.mini-card .v{font-size:20px;font-weight:700;letter-spacing:-.5px;margin-top:6px}
.mini-card .v small{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-left:2px}
/* 时间轴 */
.timeline{position:relative;padding:4px 0 2px}
.tl-item{position:relative;padding:0 0 16px 30px}
.tl-item:last-child{padding-bottom:2px}
.tl-item::before{
  content:"";position:absolute;left:8.5px;top:6px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2.5px solid var(--brand);z-index:1;
}
.tl-item::after{content:"";position:absolute;left:12.5px;top:17px;bottom:0;width:1.5px;background:var(--line)}
.tl-item:last-child::after{display:none}
.tl-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.tl-stage{font-size:13.5px;font-weight:650;letter-spacing:-.2px}
.tl-min{font-size:10.5px;font-weight:600;color:var(--brand);background:var(--brand-50);border-radius:6px;padding:2px 6px}
.tl-text{font-size:12.5px;line-height:1.7;color:var(--ink-2)}
/* 可编辑内容 */
.editable{border-radius:10px;padding:6px 8px;margin:-6px -8px;transition:background .15s, box-shadow .15s;outline:none;line-height:1.72}
[contenteditable="true"].editable:hover{background:#F8FAFF}
[contenteditable="true"].editable:focus{background:#F7F9FF;box-shadow:0 0 0 2.5px rgba(43,74,203,.16)}
.edit-hint{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px;margin:0 2px 8px}
.collapse-head{
  display:flex;align-items:center;gap:9px;cursor:pointer;padding:13px 14px;user-select:none;
}
.collapse-head .ic{width:26px;height:26px;border-radius:8px;background:var(--brand-50);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.collapse-head h3{margin:0;font-size:14px;flex:1;letter-spacing:-.2px}
.collapse-head .chev{transition:transform .2s}
.collapse.open .collapse-head .chev{transform:rotate(180deg)}
.collapse-body{display:none;padding:0 14px 14px}
.collapse.open .collapse-body{display:block;animation:pageIn .2s ease-out}
.goal-row{display:flex;gap:9px;padding:9px 0}
.goal-row + .goal-row{border-top:1px dashed var(--line)}
.goal-key{
  flex:0 0 46px;font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-50);
  border-radius:6px;height:20px;display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.goal-row .goal-key.k2{color:#0F8A4A;background:#EEF7F1}
.goal-row .goal-key.k3{color:#B7791F;background:#FFF6E6}
/* 参考资料 */
.ref-item{display:flex;gap:9px;align-items:flex-start;padding:11px 0}
.ref-item + .ref-item{border-top:1px solid var(--line-2)}
.ref-item .doc{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--brand-50);color:var(--brand);
  display:flex;align-items:center;justify-content:center;
}
.ref-item .fn{font-size:13px;font-weight:600;letter-spacing:-.1px;word-break:break-all}
.ref-item .sec-txt{font-size:11.5px;color:var(--brand);margin-top:3px;display:flex;align-items:center;gap:5px;cursor:pointer}
.ref-item .sec-txt:hover{text-decoration:underline}
/* 上传 */
.dropzone{
  border:1.5px dashed #C6D2E8;border-radius:16px;background:#FBFCFF;padding:26px 18px;text-align:center;cursor:pointer;
  transition:all .16s;
}
.dropzone:hover{border-color:var(--brand);background:var(--brand-50)}
.dropzone .ico{
  width:56px;height:56px;border-radius:16px;background:#fff;border:1px solid var(--line);color:var(--brand);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:var(--sh-1);
}
.dropzone h4{margin:0;font-size:14.5px;letter-spacing:-.2px}
.dropzone p{margin:6px 0 0;font-size:11.5px;color:var(--ink-3)}
.pick-li{display:flex;gap:11px;align-items:center;padding:11px 13px;cursor:pointer}
.pick-li:hover{background:#FAFBFE}
.pick-li+.pick-li{border-top:1px solid var(--line-2)}
.progress{height:7px;border-radius:6px;background:#E7ECF6;overflow:hidden}
.progress > i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#4B6BE5,#2B4ACB);transition:width .25s ease}
/* 生成中 */
.gen-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 8px 0}
.orb{
  width:104px;height:104px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 30%, #6E8BF5, #2B4ACB 62%, #1B2F87);
  box-shadow:0 22px 44px -18px rgba(43,74,203,.75);color:#fff;font-weight:700;font-size:20px;letter-spacing:.5px;
}
.orb::before{
  content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid rgba(43,74,203,.24);
  border-top-color:var(--brand);animation:spin 1.5s linear infinite;
}
.orb::after{
  content:"";position:absolute;inset:-28px;border-radius:50%;border:1px dashed rgba(43,74,203,.18);
  animation:spin 8s linear infinite reverse;
}
.gen-wrap h2{font-size:17px;margin:30px 0 0;letter-spacing:-.3px}
.gen-wrap .gen-sub{font-size:12.5px;color:var(--ink-3);margin:9px 0 22px;line-height:1.7}
.steps{list-style:none;padding:0;margin:20px 0 0;width:100%;display:flex;flex-direction:column;gap:9px}
.steps li{
  display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--ink-3);background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left;transition:all .25s;
}
.steps li .dot{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:1.5px solid #D7DEEA;display:flex;align-items:center;justify-content:center}
.steps li.doing{color:var(--brand);border-color:var(--brand-100);background:var(--brand-50)}
.steps li.doing .dot{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink-2)}
.steps li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.gen-refs{
  margin-top:18px;font-size:11px;color:var(--ink-3);background:#fff;border:1px dashed var(--line);
  border-radius:12px;padding:10px 12px;line-height:1.7;text-align:left;
}
/* 我的 */
.profile{display:flex;gap:13px;align-items:center;padding:17px}
.profile .nm{font-size:17px;font-weight:700;letter-spacing:-.3px;margin:0}
.profile .meta{font-size:11.5px;color:var(--ink-3);margin:5px 0 0;line-height:1.6}
.profile .avs{
  width:58px;height:58px;flex:0 0 58px;border-radius:20px;color:#fff;font-size:21px;font-weight:700;
  background:linear-gradient(150deg,#4B6BE5,#22347F);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-brand);
}
.menu-item{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer}
.menu-item+.menu-item{border-top:1px solid var(--line-2)}
.menu-item:hover{background:#FAFBFE}
.menu-item .mi-ic{
  width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--brand-50);color:var(--brand);
}
.menu-item .mi-t{font-size:14px;font-weight:600;letter-spacing:-.1px}
.menu-item .mi-s{font-size:11px;color:var(--ink-3);margin-top:3px}
/* 登录 */
.login{padding:0}
.login-hero{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:44px 26px 0;position:relative;
}
.login-hero::before{
  content:"";position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(43,74,203,.16),rgba(43,74,203,0) 66%);
}
.logo{
  width:88px;height:88px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#3355D6,#1B2F87);box-shadow:0 20px 38px -16px rgba(43,74,203,.75);color:#fff;
}
.login-hero h1{font-size:24px;margin:22px 0 0;letter-spacing:-.6px}
.login-hero .tagline{font-size:13.5px;color:var(--ink-2);margin:11px 0 0;letter-spacing:-.1px}
.points{display:flex;flex-direction:column;gap:11px;margin:26px 0 0;text-align:left;width:100%}
.point{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.point .pi{
  width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--brand-50);color:var(--brand);
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.login-actions{padding:24px 30px 30px;display:flex;flex-direction:column;align-items:center;gap:11px}
.wechat-ic{width:18px;height:18px}
.legal{font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.7}
.legal a{color:var(--brand);text-decoration:none}
/* 覆盖层：弹窗 / 动作面板 / toast */
.layers{position:absolute;inset:0;pointer-events:none;z-index:20}
.layers.on{pointer-events:auto}
.mask{
  position:absolute;inset:0;background:rgba(15,23,42,.44);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;animation:fade .18s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:276px;background:#fff;border-radius:20px;overflow:hidden;text-align:center;
  animation:pop .22s cubic-bezier(.2,.9,.35,1.1);box-shadow:var(--sh-2);
}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.modal .mh{padding:21px 20px 0}
.modal h4{margin:0;font-size:16.5px;letter-spacing:-.3px}
.modal p{margin:9px 0 0;font-size:13px;color:var(--ink-2);line-height:1.66}
.modal .mf{display:flex;border-top:1px solid var(--line);margin-top:19px}
.modal .mf button{
  all:unset;cursor:pointer;flex:1;padding:14px;font-size:15px;font-weight:600;text-align:center;color:var(--ink-2);
}
.modal .mf button + button{border-left:1px solid var(--line)}
.modal .mf button.pri{color:var(--brand)}
.modal .mf button.dgr{color:var(--danger)}
.modal .mf button:hover{background:#F7F9FD}
.sheet-wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .18s ease-out}
.sheet{
  background:#F7F9FC;border-radius:20px 20px 0 0;overflow:hidden;padding-bottom:22px;
  animation:up .24s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px -12px rgba(15,23,42,.35);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .sh{text-align:center;font-size:12.5px;color:var(--ink-3);padding:15px 0 11px}
.sheet .grp{background:#fff;margin:0 12px 8px;border-radius:14px;overflow:hidden}
.sheet .grp button{
  all:unset;cursor:pointer;display:block;width:100%;text-align:center;padding:15px;font-size:15.5px;color:var(--ink);
  font-weight:500;
}
.sheet .grp button + button{border-top:1px solid var(--line-2)}
.sheet .grp button:hover{background:#F7F9FD}
.sheet .grp button.dgr{color:var(--danger)}
.sheet .grp button .sb{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;font-weight:400}
.sheet .cancel{
  all:unset;cursor:pointer;display:block;margin:4px 12px 0;background:#fff;border-radius:14px;
  text-align:center;padding:15px;font-size:15.5px;font-weight:600;color:var(--ink);
}
.toast{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(15,23,42,.87);color:#fff;border-radius:13px;padding:13px 17px;font-size:13.5px;
  display:flex;align-items:center;gap:9px;max-width:250px;line-height:1.5;
  animation:pop .2s cubic-bezier(.2,.9,.35,1.1);box-shadow:0 18px 40px -16px rgba(0,0,0,.6);text-align:left;
}
.toast.out{animation:fadeOut .22s ease-in forwards}
@keyframes fadeOut{to{opacity:0;transform:translate(-50%,-50%) scale(.96)}}
.toast .tic{flex:0 0 16px}
</style>
</head>

function nav(route, params = {}, opt = {}){
  clearTimers();
  if(opt.back){
    const prev = S.history.pop() || 'home';
    S.route = prev; S.params = S.histParams ? (S.histParams.pop() || {}) : {};
  } else {
    if(S.route && S.route !== route) S.history.push(S.route);
    S.route = route; S.params = params;
  }
  render();
}
function goTab(route){ clearTimers(); S.history = []; S.route = route; S.params = {}; render(); }

function render(){
  const meta = ROUTES[S.route] || ROUTES.home;
  const prevTop = $('.viewport').scrollTop;

  view.innerHTML = out;

    (meta.back ? '<button class="nav-back" data-act="back" aria-label="返回">' + I.back + '</button>' : '') +

  // Tab Bar
  const tb = $('#tabbar');
  tb.classList.toggle('hide', !meta.tab);
  tb.innerHTML = meta.tab ? [
    ['home','首页',I.home],['courses','课程',I.grid],['me','我的',I.user]
  ].map(([r,l,ic]) => '<button class="tab' + (S.route === r ? ' active' : '') + '" data-tab="' + r + '">' + ic + '<span>' + l + '</span></button>').join('') : '';
  // 侧边导航高亮
  $$('#navlist button').forEach(b => b.classList.toggle('active', b.dataset.route === S.route));
  const active = $('#navlist button.active');
  if(active) active.scrollIntoView({ block:'nearest' });
  // 页面进入后的副作用
  if(hooks[S.route]) hooks[S.route]();
}

function chip(status){
  return status === 'final'
    ? '<span class="chip final"><span class="chip-dot" style="background:currentColor"></span>已定稿</span>'
    : '<span class="chip draft"><span class="chip-dot" style="background:currentColor"></span>草稿</span>';
}
function matChip(m){
  if(m.status === 'ok') return '<span class="chip ok">解析成功</span>';
  if(m.status === 'loading') return '<span class="chip load">解析中</span>';
  return '<span class="chip err">解析失败</span>';
}

/* ---- 5. 课程详情 ---- */

/* ---- 6. 教学资料列表 ---- */
screens.materials = () => {
  const c = course(S.params.course || 'phys');
  const head = '<div class="sec-head" style="margin:8px 2px 12px"><div>' +
    '<h1 class="page-title" style="margin:0">教学资料</h1>' +
    '<p class="page-sub" style="margin:4px 0 0">所属课程：' + esc(c.name) + '</p></div>' +
    '<button class="btn btn-soft btn-sm" data-nav="upload" data-course="' + c.id + '">' + I.upload + '上传资料</button></div>';

  if(!c.materials.length){
    return '<div class="page">' + head +
      '<div class="card"><div class="empty"><div class="art">' + I.emptyDoc + '</div>' +
      '<h4>还没有教学资料</h4>' +
      '<p>目前仅支持 .txt、.md 文件，单个文件不超过 5MB。上传后教案会引用这些资料的具体段落。</p>' +
      '<button class="btn btn-primary btn-sm" data-nav="upload" data-course="' + c.id + '">' + I.upload + '上传资料</button></div></div></div>';
  }

  const items = c.materials.map(m => {
    const actions = m.status === 'bad'
      ? '<div style="display:flex;gap:8px;margin-top:9px"><button class="btn btn-ghost btn-sm" data-act="why" data-mat="' + m.id + '" data-course="' + c.id + '">查看原因</button>' +
        '<button class="btn btn-soft btn-sm" data-act="reupload" data-mat="' + m.id + '" data-course="' + c.id + '">重新上传</button></div>'
      : (m.status === 'loading' ? '<p class="m" style="margin-top:7px">正在解析内容，完成后即可用于生成教案…</p>' : '');
    return '<div class="li" style="align-items:flex-start;cursor:default" data-row="' + m.id + '">' +
      '<div class="fileicon ' + m.ext.toLowerCase() + '">' + m.ext + '</div>' +
      '<div class="grow">' +
        '<p class="t" style="padding-right:2px">' + esc(m.name) + '</p>' +
        '<p class="m"><span class="chip neutral">' + m.ext + '</span><span>' + esc(m.size) + '</span><span>·</span><span>' + esc(m.time) + '</span></p>' +

      '<button class="btn btn-sm" style="padding:7px;color:var(--ink-3)" data-act="delMat" data-mat="' + m.id + '" data-course="' + c.id + '" aria-label="删除资料">' + I.trash + '</button>' +
    '</div>';
  }).join('');

  return '<div class="page">' + head +

    '<div class="card">' + items + '</div>' +

};

/* ---- 7. 上传资料 ---- */
const PICKABLE = [
  { key:'ok1', name:'热学与热力学基础.md', ext:'MD', size:'264 KB', ok:true },
  { key:'ok2', name:'实验讲义-验证牛顿第二定律.txt', ext:'TXT', size:'128 KB', ok:true },
  { key:'bad', name:'旧版力学讲义.txt', ext:'TXT', size:'1.8 MB', ok:false,
    reason:'文件编码为 GBK，解析在读到第 41 行时中断。请另存为 UTF-8 编码的 .txt 后重新上传。' },
  { key:'big', name:'课程录音整理.txt', ext:'TXT', size:'6.4 MB', ok:false, tooBig:true }
];
screens.upload = () => {
  const c = course(S.params.course || 'phys');
  const pickedKey = S.params.pick || '';
  const picked = PICKABLE.find(p => p.key === pickedKey);
  const stage = S.params.stage || 'pick'; // pick | uploading | done | failed | error

  let selected = '';
  if(picked){
    const isErr = stage === 'error';
    selected =
      '<div class="card" style="padding:14px;margin-top:14px" id="upBox">' +
        '<div style="display:flex;gap:12px;align-items:center">' +
          '<div class="fileicon big ' + (picked.ext || 'txt').toLowerCase() + '">' + picked.ext + '</div>' +
          '<div class="grow" style="flex:1;min-width:0">' +
            '<p style="margin:0;font-size:14px;font-weight:650;letter-spacing:-.2px">' + esc(picked.name) + '</p>' +
            '<p class="m" style="margin:5px 0 0"><span>' + esc(picked.size) + '</span></p>' +
            '<p class="m" style="margin:4px 0 0"><span>所属课程：' + esc(c.name) + '</span></p>' +
          '</div>' +
          (stage === 'pick' || isErr ? '<button class="btn btn-sm" style="padding:7px;color:var(--ink-3)" data-act="clearPick" aria-label="移除">' + I.trash + '</button>' : '') +
        '</div>' +
        (isErr ? '<div class="notice warn" style="margin-top:12px">' + I.warn + '<span class="ic"></span><span>单个文件不超过 <b>5MB</b>，当前为 6.4MB。请压缩内容或拆分为多份后再上传。</span></div>' : '') +
        (stage === 'uploading' ?
          '<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-bottom:7px">' +
            '<span id="upTxt">正在上传…</span><span id="upPct">0%</span></div>' +
            '<div class="progress"><i id="upBar"></i></div>' +
            '<p class="m" style="margin:9px 0 0">上传完成后会自动解析，无需手动操作。</p></div>' : '') +
        (stage === 'done' ?
          '<div class="notice ok" style="margin-top:14px"><span class="ic">' + I.check + '</span>' +
          '<span><b>资料已解析，可用于生成教案。</b>已生成 46 个引用段，生成教案时会优先参考。</span></div>' : '') +
        (stage === 'failed' ?
          '<div class="notice warn" style="margin-top:14px">' + I.warn +
          '<span class="ic"></span><span><b>解析失败：</b>' + esc(picked.reason || '文件内容无法读取。') + '</span></div>' : '') +
      '</div>';
  }

  const pickList =
    '<div class="card" style="margin-top:14px;overflow:hidden"><div class="sec-head" style="margin:0;padding:12px 14px 8px">' +
      '<h3 style="font-size:12.5px;color:var(--ink-3);font-weight:600">从本机选择（原型示例文件）</h3></div>' +
      PICKABLE.map(p =>
        '<div class="pick-li" data-act="pick" data-key="' + p.key + '" data-course="' + c.id + '">' +
          '<div class="fileicon ' + p.ext.toLowerCase() + '">' + p.ext + '</div>' +
          '<div style="flex:1;min-width:0"><p style="margin:0;font-size:13.5px;font-weight:600">' + esc(p.name) + '</p>' +
          '<p class="m" style="margin:4px 0 0">' + esc(p.size) + (p.tooBig ? ' · 超出 5MB' : '') + '</p></div>' +
          (pickedKey === p.key ? '<span class="chip load">已选择</span>' : I.chev) +
        '</div>').join('') + '</div>';

  let bottom = '';
  if(stage === 'pick' || stage === 'error'){
    bottom = '<button class="btn btn-primary btn-block" data-act="doUpload" ' + (picked ? '' : 'disabled') + '>' + I.upload + '上传并解析</button>' +
      '<p class="bar-hint">' + (picked ? '仅支持 TXT、MD，≤5MB' : '请先选择要上传的文件') + '</p>';
  } else if(stage === 'uploading'){
    bottom = '<button class="btn btn-primary btn-block" disabled><span class="spinner"></span>正在上传…</button>' +
      '<p class="bar-hint">请保持页面开启，解析完成后会给出提示</p>';
  } else if(stage === 'done'){
    bottom = '<div class="row"><button class="btn btn-ghost" data-nav="materials" data-course="' + c.id + '">返回教学资料</button>' +
      '<button class="btn btn-primary" data-nav="plan-generate" data-course="' + c.id + '">去生成教案</button></div>';
  } else {
    bottom = '<div class="row"><button class="btn btn-ghost" data-act="pick" data-key="' + pickedKey + '" data-course="' + c.id + '">重新选择</button>' +
      '<button class="btn btn-primary" data-act="doUpload">重试上传</button></div>';
  }

  return '<div class="page">' +
    '<div class="dropzone" data-act="pickRandom" data-course="' + c.id + '">' +
      '<div class="ico">' + I.upload + '</div>' +
      '<h4>选择教学资料文件</h4>' +
      '<p>仅支持 TXT、MD，单个文件 ≤ 5MB</p>' +
    '</div>' +
    (picked ? selected : '') +
    (stage === 'pick' || stage === 'error' ? pickList : '') +
    '<div class="bottom-bar">' + bottom + '</div></div>';
};

/* ---- 9. 教案详情 / 编辑 ---- */
screens['plan-detail'] = () => {
  const p = findPlan(S.params.plan || 'p1') || allPlans()[0];
  const c = course(p.courseId);
  const body = S.planBody[p.id] || S.planBody.p1;
  const noRefs = S.demo.noRefs || !p.refs || p.refs.length === 0;
  const editable = p.status === 'draft';
  const ce = editable ? ' contenteditable="true"' : '';
  const totMin = body.process.reduce((n, x) => n + Number(x.min), 0);

  const sec = (id, icon, title, extra, inner) =>
    '<div class="card collapse ' + (S.ui.collapsed[id] ? '' : 'open') + '" data-collapse="' + id + '" style="margin-top:11px">' +
      '<div class="collapse-head" data-act="toggle" data-id="' + id + '"><span class="ic">' + icon + '</span>' +
      '<h3>' + title + '</h3>' + (extra || '') + I.chevDown + '</div>' +
      '<div class="collapse-body">' + inner + '</div></div>';

  const goals =
    '<div class="goal-row"><span class="goal-key">知识</span><div class="editable" ' + (editable ? 'contenteditable="true"' : '') + ' data-plan="' + p.id + '" data-field="goal.knowledge">' + esc(body.goal.knowledge) + '</div></div>' +
    '<div class="goal-row"><span class="goal-key k2">能力</span><div class="editable" ' + (editable ? 'contenteditable="true"' : '') + ' data-plan="' + p.id + '" data-field="goal.ability">' + esc(body.goal.ability) + '</div></div>' +

const hooks = {};

hooks['plan-generating'] = () => {
  const bar = $('#genBar'); if(!bar) return;
  const steps = $$('#genSteps li');
  const meta = S.params.meta || {};
  const fail = S.demo.timeout;
  let pct = 0;
  const tick = setInterval(() => {
    pct = Math.min(96, pct + 3 + Math.random() * 5);
    bar.style.width = pct + '%';
    if(pct > 30) { steps[0].className = 'done'; steps[0].querySelector('.dot').innerHTML = I.check; steps[1].className = 'doing'; }
    if(pct > 72) { steps[1].className = 'done'; steps[1].querySelector('.dot').innerHTML = I.check; steps[2].className = 'doing'; }
  }, 190);
  after(2900, () => {
    clearInterval(tick);
    if(fail){
      const wrap = $('#genWrap');
      if(wrap){
        wrap.innerHTML =
          '<div class="orb" style="background:radial-gradient(circle at 34% 30%, #F09A9D, #E5484D 62%, #A3262B);box-shadow:0 22px 44px -18px rgba(229,72,77,.7)">!</div>' +
          '<h2 style="margin-top:28px">生成超时，可重试</h2>' +
          '<p class="gen-sub">已等待超过 2 分钟，可能是资料较多或网络较慢。<br>已保留你填写的教学信息。</p>' +
          '<div style="width:100%;display:flex;flex-direction:column;gap:10px;margin-top:4px">' +
            '<button class="btn btn-primary btn-block" data-act="retryGen">重新生成</button>' +
            '<button class="btn btn-ghost btn-block" data-act="back">返回修改教学信息</button></div>' +
          '<div class="gen-refs" style="margin-top:16px">本次参考：' + esc(meta.refs || '大学物理第一章.md、牛顿运动定律.txt') + '<br>若多次失败，可减少资料份数后重试。</div>';
      }
      return;
    }
    bar.style.width = '100%';
    steps.forEach(s => { s.className = 'done'; s.querySelector('.dot').innerHTML = I.check; });
    after(340, () => {
      // 生成新草稿
      const c = course(meta.courseId || 'phys');
      const id = 'p' + Math.random().toString(36).slice(2, 8);
      const refs = (S.demo.noRefs || S.params.meta.notRef) ? [] :
        c.materials.filter(m => m.status === 'ok').slice(0,2).map((m, i) => ({ file:m.name, ext:m.ext, sec:'# 第 ' + (3 + i * 5) + ' 段' }));
      c.plans.unshift({
        id, title:(meta.theme || '牛顿第二定律') + '教案', theme:meta.theme || '牛顿第二定律',
        audience:meta.audience || '大学一年级理工科', duration:meta.duration || 45,
        type:meta.type || '理论', status:'draft', updated:'刚刚', ts:200, refs
      });
      if(!S.planBody[id]){
        S.planBody[id] = JSON.parse(JSON.stringify(S.planBody.p1));
        if(meta.customGoal) S.planBody[id].goal.knowledge = meta.customGoal;
        if(!refs.length){ S.planBody[id].goal.knowledge = '掌握' + (meta.theme || '本主题') + '的基本内容与常见应用场景。'; }
      }
      S.history = [];
      S.route = 'plan-detail'; S.params = { plan:id };
      render();
      toast(refs.length ? '教案草稿已生成，引用来源已标注' : '教案草稿已生成（未引用到上传资料）');
    });
  });
};

hooks.upload = () => {
  if((S.params.stage || '') !== 'uploading') return;
  const bar = $('#upBar'), pct = $('#upPct'), txt = $('#upTxt');
  if(!bar) return;
  const picked = PICKABLE.find(p => p.key === S.params.pick);
  let v = 0;
  const t = setInterval(() => {
    v = Math.min(100, v + 7 + Math.random() * 9);
    const w = $('#upBar'); if(!w){ clearInterval(t); return; }
    w.style.width = v + '%';
    if($('#upPct')) $('#upPct').textContent = Math.floor(v) + '%';
    if($('#upTxt') && v > 55) $('#upTxt').textContent = '上传完成，正在解析内容…';
    if(v >= 100){
      clearInterval(t);
      const c = course(S.params.course);
      after(520, () => {
        if(picked && !picked.ok){
          if(picked.tooBig){
            nav('upload', { course:c.id, pick:picked.key, stage:'error' });
          } else {
            /**** 解析失败：写入失败资料 ****/
            c.materials.unshift({ id:'m' + Date.now(), name:picked.name, ext:picked.ext, size:picked.size, time:'刚刚', status:'bad', reason:picked.reason, ts:201 });
            nav('upload', { course:c.id, pick:picked.key, stage:'failed' });
          }
          return;
        }
        /**** 解析成功：写入资料 ****/
        c.materials.unshift({ id:'m' + Date.now(), name:picked.name, ext:picked.ext, size:picked.size, time:'刚刚', status:'ok', ts:201 });
        nav('upload', { course:c.id, pick:picked.key, stage:'done' });
      });
    }
  }, 220);
};

hooks.materials = () => {
  // 「解析中」的资料 2 秒后转为成功，演示状态流转
  const loading = S.courses.flatMap(c => c.materials.filter(m => m.status === 'loading'));
  if(!loading.length) return;
  after(2200, () => {
    loading.forEach(m => { m.status = 'ok'; });
    if(S.route === 'materials'){ render(); toast('《' + loading[0].name + '》解析成功，可用于生成教案'); }
  });
};

/* ============================================================
   5. 覆盖层：toast / 弹窗 / 动作面板
   ============================================================ */
function layer(html, autoCloseMs){
  const L = $('#layers');
  L.classList.add('on');
  L.innerHTML = html;
  if(autoCloseMs) after(autoCloseMs, closeLayer);
  const mask = L.firstElementChild;
  if(mask && mask.dataset.closable === '1'){
    mask.addEventListener('click', e => { if(e.target === mask) closeLayer(); });
  }
}
function closeLayer(){ const L = $('#layers'); L.classList.remove('on'); L.innerHTML = ''; }
function toast(msg, kind){
  const L = $('#layers');
  L.classList.add('on');
  const ic = kind === 'err' ? I.warn : I.check;
  L.innerHTML = '<div class="toast" id="tst"><span class="tic" style="color:' + (kind === 'err' ? '#FFB4B6' : '#7BE3A6') + '">' + ic + '</span><span>' + esc(msg) + '</span></div>';
  after(1700, () => {
    const t = $('#tst');
    if(t){ t.classList.add('out'); after(230, () => { if($('#tst')) closeLayer(); }); }
  });
}
function confirmBox({ title, desc, ok = '确定', cancel = '取消', danger }){
  return new Promise(res => {
    layer('<div class="mask" data-closable="1"><div class="modal">' +
      '<div class="mh"><h4>' + esc(title) + '</h4><p>' + desc + '</p></div>' +
      '<div class="mf"><button data-c="0">' + esc(cancel) + '</button>' +
      '<button class="' + (danger ? 'dgr' : 'pri') + '" data-c="1">' + esc(ok) + '</button></div></div></div>');
    $$('#layers [data-c]').forEach(b => b.addEventListener('click', () => {
      closeLayer(); res(b.dataset.c === '1');
    }));
  });
}
function sheet(title, groups){
  layer('<div class="mask" data-closable="1" style="align-items:flex-end;background:rgba(15,23,42,.4)">' +
    '<div class="sheet-wrap"><div class="sheet"><div class="sh">' + esc(title) + '</div>' +
    groups.map(g => '<div class="grp">' + g.map(a =>
      '<button class="' + (a.danger ? 'dgr' : '') + '" data-k="' + a.k + '">' + esc(a.label) +
      (a.sub ? '<span class="sb">' + esc(a.sub) + '</span>' : '') + '</button>').join('') + '</div>').join('') +
    '<button class="cancel" data-k="__cancel">取消</button></div></div></div>');
  $$('#layers [data-k]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    closeLayer();
    const all = groups.flat();
    const hit = all.find(a => a.k === k);
    if(hit && hit.onClick) hit.onClick();
    else if(handlers[k]) handlers[k]();
  }));
}

}));

$('#demoEmpty').addEventListener('change', e => { S.demo.empty = e.target.checked; render(); });
$('#demoTimeout').addEventListener('change', e => { S.demo.timeout = e.target.checked; toast(e.target.checked ? '已开启：生成将演示超时失败' : '已关闭超时演示'); });
$('#demoNoRefs').addEventListener('change', e => { S.demo.noRefs = e.target.checked; render(); if(S.route === 'plan-detail') toast(e.target.checked ? '已开启：教案显示“通用知识生成”提示' : '已关闭资料不足演示'); });
$('#resetDemo').addEventListener('click', () => {
  S = seed();
  $('#demoEmpty').checked = false; $('#demoTimeout').checked = false; $('#demoNoRefs').checked = false;
  S.route = 'home'; S.user.logged = true; render(); toast('演示数据已重置');
});

// 全局点击委托
document.addEventListener('click', async e => {
  // tab bar
  const tab = e.target.closest('[data-tab]');
  if(tab){ goTab(tab.dataset.tab); return; }

  // 页面跳转（先处理，避免被子元素拦截）
  const navEl = e.target.closest('[data-nav]');
  if(navEl && !e.target.closest('[data-act]')){
    const r = navEl.dataset.nav;
    const p = { course:navEl.dataset.course || S.params.course, plan:navEl.dataset.plan || 'p1', filter:navEl.dataset.filter };
    nav(r, p); return;
  }
  if(navEl){ /* data-act 优先 */ }

  const act = e.target.closest('[data-act]');
  if(!act) return;
  const a = act.dataset.act;
  const courseId = act.dataset.course || S.params.course || 'phys';
  const p = findPlan(act.dataset.plan);

  switch(a){
    case 'back': nav(null, {}, { back:true }); break;
    case 'legal': toast('原型演示：用户协议与隐私政策'); break;

    /* 登录 */
    case 'login': {
      const btn = $('#loginBtn');
      btn.innerHTML = '<span class="spinner"></span>正在登录…';
      btn.style.opacity = '.86';
      after(950, () => {
        S.user.logged = true; goTab('home');
        toast('登录成功，欢迎回来，' + S.user.name);
      });
      break;
    }

    /* 首页 / 课程 */
    case 'quickGen': {
      const c = S.courses.slice().sort((x,y) => y.ts - x.ts)[0] || null;
      S.form.theme = S.form.theme || '牛顿第二定律';
      S.form.audience = S.form.audience || '大学一年级理工科';
      S.form.duration = S.form.duration || '45';
      nav('plan-generate', { course:(c && c.id) || 'phys' });
      break;
    }
    case 'createCourse': {
      const nameEl = $('[data-form="courseName"]');
      const name = (nameEl.value || '').trim();
      const field = $('#fName');
      if(name.length < 2){ field.classList.add('invalid'); nameEl.focus(); toast('请先填写课程名称', 'err'); return; }
      field.classList.remove('invalid');
      const id = 'c' + Date.now();
      S.courses.unshift({
        id, name, intro:(S.form.courseIntro || '').trim() || '暂无简介，可进入课程详情补充资料与教案。',
        updated:'刚刚', ts:210, materials:[], plans:[]
      });
      S.form.courseName = ''; S.form.courseIntro = '';
      goTab('courses');
      after(60, () => { nav('course-detail', { course:id }); toast('课程已创建，先上传教学资料吧'); });
      break;
    }
    case 'courseMore': {
      const c = course(courseId);
      sheet('课程操作', [[
        { k:'rename', label:'编辑课程信息', sub:'修改课程名称与简介', onClick:() => {
            const nm = prompt('课程名称', c.name);
            if(nm && nm.trim()){ c.name = nm.trim(); render(); toast('课程名称已更新'); }
          }},
        { k:'delCourse', label:'删除课程', danger:true, sub:'课程下的资料与教案会一并删除', onClick:async () => {
            const ok = await confirmBox({ title:'删除《' + c.name + '》？', desc:'该课程下的 <b>' + c.materials.length + ' 份资料</b> 与 <b>' + c.plans.length + ' 份教案</b> 会一并删除，且无法恢复。', ok:'删除课程', danger:true });
            if(!ok) return;
            S.courses = S.courses.filter(x => x.id !== c.id);
            goTab('courses'); toast('课程已删除');
          }}
      ]]);
      break;
    }

    /* 资料 */
    case 'pick': {
      const key = act.dataset.key;
      const picked = PICKABLE.find(x => x.key === key);
      nav('upload', { course:courseId, pick:key, stage:picked.tooBig ? 'error' : 'pick' });
      break;
    }
    case 'pickRandom': {
      nav('upload', { course:courseId, pick:'ok1', stage:'pick' });
      toast('已选择：热学与热力学基础.md');
      break;
    }
    case 'clearPick': nav('upload', { course:courseId }); break;
    case 'doUpload': {
      const key = S.params.pick || 'ok1';
      nav('upload', { course:courseId, pick:key, stage:'uploading' });
      break;
    }
    case 'delMat': {
      const c = course(courseId);
      const m = c.materials.find(x => x.id === act.dataset.mat);
      const ok = await confirmBox({ title:'删除这份资料？', desc:'《' + esc(m.name) + '》删除后，已生成教案中的引用来源标注不会自动更新。', ok:'删除', danger:true });
      if(!ok) return;
      c.materials = c.materials.filter(x => x.id !== m.id);
      render(); toast('资料已删除');
      break;
    }
    case 'why': {
      const c = course(courseId);
      const m = c.materials.find(x => x.id === act.dataset.mat);
      layer('<div class="mask" data-closable="1"><div class="modal"><div class="mh"><h4>解析失败原因</h4>' +
        '<p style="text-align:left">《' + esc(m.name) + '》<br><br>' + esc(m.reason || '文件内容无法读取，请检查编码后重试。') + '</p></div>' +
        '<div class="mf"><button data-c="2">取消</button><button class="pri" data-c="1">重新上传</button></div></div></div>');
      $$('#layers [data-c]').forEach(b => b.addEventListener('click', () => {
        const v = b.dataset.c; closeLayer();
        if(v === '1') nav('upload', { course:courseId, pick:'ok2', stage:'pick' });
      }));
      break;
    }
    case 'reupload': nav('upload', { course:courseId, pick:'ok2', stage:'pick' }); break;

    /* 生成教案 */
    case 'pickCourse': {
      sheet('切换所属课程', [S.courses.map(c => ({
        k:'pick_' + c.id, label:c.name, sub:c.materials.length + ' 份资料 · ' + c.plans.length + ' 份教案',
        onClick:() => { S.params = Object.assign({}, S.params, { course:c.id }); render(); toast('已切换到《' + c.name + '》'); }
      }))]);
      break;
    }
    case 'setType': S.form.type = act.dataset.val; render(); break;
    case 'gen': {
      const theme = ($('[data-form="theme"]') || {}).value || '';
      const aud = ($('[data-form="audience"]') || {}).value || '';
      const dur = ($('[data-form="duration"]') || {}).value || '';
      const goal = ($('[data-form="goal"]') || {}).value || '';
      S.form.theme = theme.trim(); S.form.audience = aud.trim(); S.form.duration = String(dur).trim(); S.form.goal = goal;
      let bad = null;
      if(!S.form.theme){ $('#fTheme').classList.add('invalid'); bad = bad || $('#fTheme'); }
      if(!S.form.audience){ $('#fAud').classList.add('invalid'); bad = bad || $('#fAud'); }
      const n = Number(S.form.duration);
      if(!/^\d+$/.test(S.form.duration) || n < 10 || n > 180){ $('#fDur').classList.add('invalid'); bad = bad || $('#fDur'); }
      if(bad){ bad.scrollIntoView({ block:'center', behavior:'smooth' }); toast('还有必填信息未填完', 'err'); return; }
      const c = course(courseId);
      const okMats = c.materials.filter(m => m.status === 'ok');
      nav('plan-generating', { meta:{
        theme:S.form.theme, courseId:c.id, duration:n, audience:S.form.audience, type:S.form.type,
        customGoal:S.form.goal, mats:okMats.length,
        refs:okMats.length ? okMats.slice(0,2).map(m => m.name).join('、') : '（未检索到可用资料）'
      }});
      break;
    }
    case 'retryGen': {
      const meta = S.params.meta || {};
      nav('plan-generating', { meta });
      break;
    }

    /* 教案详情 */
    case 'toggle': {
      const id = act.dataset.id;
      S.ui.collapsed[id] = !S.ui.collapsed[id];
      act.closest('.collapse').classList.toggle('open', !S.ui.collapsed[id]);
      break;
    }
    case 'saveDraft': {
      const cur = livePlan(act.dataset.plan);
      if(cur){ cur.updated = '刚刚'; cur.ts = 205; }
      render(); toast('草稿已保存');
      break;
    }
    case 'editFinal': {
      const cur = livePlan(act.dataset.plan);
      if(cur){ cur.status = 'draft'; cur.updated = '刚刚'; cur.ts = 206; }
      render(); toast('已回到可编辑状态，保存后可再次定稿');
      break;
    }
    case 'finalize': {
      const cur = livePlan(act.dataset.plan);
      const ok = await confirmBox({ title:'标记为定稿？', desc:'定稿后仍可再次编辑，确定标记为定稿吗？', ok:'标记为定稿' });
      if(!ok || !cur) return;
      cur.status = 'final'; cur.updated = '刚刚'; cur.ts = 207;
      render(); toast('已标记为定稿');
      break;
    }
    case 'planMore': {
      const cur = findPlan(act.dataset.plan);
      sheet('教案操作', [[
        { k:'goCourse', label:'查看所属课程', sub:course(cur.courseId).name, onClick:() => nav('course-detail', { course:cur.courseId }) },
        { k:'goPlans', label:'查看该课程全部教案', onClick:() => nav('plans', { course:cur.courseId }) },
        { k:'del', label:'删除教案', danger:true, onClick:async () => {
            const ok = await confirmBox({ title:'删除这份教案？', desc:'《' + esc(cur.title) + '》删除后无法恢复。', ok:'删除', danger:true });
            if(!ok) return;
            const c = course(cur.courseId);
            c.plans = c.plans.filter(x => x.id !== cur.id);
            nav('plans', { course:c.id }); toast('教案已删除');
          }}
      ]]);
      break;
    }

    /* 教案列表 */
    case 'filter': nav('plans', { course:courseId, filter:act.dataset.val }); break;
    case 'delPlan': {
      const cur = findPlan(act.dataset.plan);
      const ok = await confirmBox({ title:'删除这份教案？', desc:'《' + esc(cur.title) + '》删除后无法恢复。', ok:'删除', danger:true });
      if(!ok) return;
      const c = course(cur.courseId);
      c.plans = c.plans.filter(x => x.id !== cur.id);
      render(); toast('教案已删除');
      break;
    }
    /* 我的 */
    case 'courses': goTab('courses'); break;
    case 'plans': {
      const c = S.courses.find(x => x.plans.some(pp => pp.status === 'draft')) || S.courses[0];
      nav('plans', { course:c.id, filter:'draft' });
      break;
    }
    case 'help': handlers.help(); break;
    case 'about': handlers.about(); break;
    case 'logout': {
      const ok = await confirmBox({ title:'退出登录？', desc:'退出后需要重新使用微信一键登录。', ok:'退出登录', danger:true });
      if(!ok) return;
      S.user.logged = false; S.history = []; S.route = 'login'; S.params = {}; render();
      break;
    }
  }
});

// 表单输入持久化
document.addEventListener('input', e => {
  const el = e.target.closest('[data-form]');
  if(el) S.form[el.dataset.form] = el.value;
  // 清除校验错误
  const wrap = e.target.closest('.field');
  if(wrap && wrap.classList.contains('invalid')) wrap.classList.remove('invalid');
});

// 可编辑内容保存
document.addEventListener('focusout', e => {
  const el = e.target.closest('.editable[data-plan]');
  if(!el) return;
  const id = el.dataset.plan;
  const body = S.planBody[id];
  if(!body) return;
  const txt = el.innerText.replace(/\u00a0/g, ' ').trim();
  if(el.dataset.proc != null){
    const i = Number(el.dataset.proc);
    const f = el.dataset.field;
    if(f === 'min'){
      const n = parseInt(txt, 10);
      body.process[i].min = isNaN(n) ? body.process[i].min : n;
      el.innerText = body.process[i].min + ' 分钟';
      return;
    }
    body.process[i][f] = txt;
    return;
  }
  const path = el.dataset.field.split('.');
  if(path.length === 2){ body[path[0]][path[1]] = txt; }
  else { body[path[0]] = txt; }
});
// 回车不换行（单行区块）
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.closest('.editable[data-field]:not([data-field="text"])') &&
     !e.target.closest('.editable[data-field="board"], .editable[data-field="homework"]')){
    e.preventDefault(); e.target.blur();
  }
});

/* 启动 */
S.user.logged = false;
render();
</script>
</body>
</html>
